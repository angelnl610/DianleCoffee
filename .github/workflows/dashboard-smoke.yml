name: Dashboard smoke tests
on:
  pull_request:
    branches: [main, integration/drive-dashboard]
  push:
    branches: [main, integration/drive-dashboard, feature/dashboard-ux]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py ui src
      - run: python -m pytest -q
